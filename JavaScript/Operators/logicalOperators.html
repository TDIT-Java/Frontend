<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Logical Operators</h1>
    <script>
        let condition1 = true;
        let condition2 = false;

        console.log(condition1 && condition2); // Logical AND: false (both must be true)
        console.log(condition1 || condition2); // Logical OR: true (at least one must be true)
        console.log(!condition1);       // Logical NOT: false (inverts the boolean value)
    </script>
</body>
</html>
