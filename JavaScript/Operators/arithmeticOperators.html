<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Arithmetic Operators</h1>
    <script>
        let x = 10;
        let y = 5;

        let sum = x + y;      
        let difference = x - y;  
        let product = x * y;   
        let quotient = x / y;  
        let remainder = x % 3; 
        let power = x ** 2;    
        console.log("sum " , sum);
        console.log("sub ", difference);
        console.log("Mul ", product);
        console.log("division (quotient) ", quotient);
        console.log("Division (remainder) ", remainder);
        console.log("Power 10 raise to 2 ", power);
    </script>
</body>
</html>
