<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Comparision Operators</h1>
    <script>
        let p = 5;
        let q = 10;
        let r = "5";

        console.log(p == r);   // Loose equality (checks value only): true
        console.log(p === r);  // Strict equality (checks value and type): false
        console.log(p != q);   // Loose inequality: true
        console.log(p !== r);  // Strict inequality: true
        console.log(p > q);    // Greater than: false
        console.log(p < q);    // Less than: true
        console.log(p >= 5);   // Greater than or equal to: true
        console.log(p <= 4);   // Less than or equal to: false
    </script>
</body>
</html>
